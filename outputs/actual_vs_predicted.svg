<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" rx="12" fill="#F8FAFC"/>
  <path d="M50 250H350" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M50 50V250" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Perfect Prediction Line -->
  <line x1="50" y1="250" x2="350" y2="50" stroke="#6366F1" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- Points -->
  <circle cx="80" cy="225" r="3" fill="#4F46E5" fill-opacity="0.6"/>
  <circle cx="120" cy="190" r="3" fill="#4F46E5" fill-opacity="0.6"/>
  <circle cx="150" cy="170" r="3" fill="#4F46E5" fill-opacity="0.6"/>
  <circle cx="190" cy="135" r="3" fill="#4F46E5" fill-opacity="0.6"/>
  <circle cx="220" cy="110" r="3" fill="#4F46E5" fill-opacity="0.6"/>
  <circle cx="260" cy="95" r="3" fill="#4F46E5" fill-opacity="0.6"/>
  <circle cx="300" cy="65" r="3" fill="#4F46E5" fill-opacity="0.6"/>
  <circle cx="330" cy="60" r="3" fill="#4F46E5" fill-opacity="0.6"/>

  <!-- Labels -->
  <text x="200" y="280" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Actual Price (Normalized)</text>
  <text x="20" y="150" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle" transform="rotate(-90 20 150)">Predicted Price</text>
  <text x="200" y="30" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1E293B" text-anchor="middle">Model Calibration: Actual vs Predicted</text>
</svg>
